# Production Profile

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Instead of giving the og url name password we put it like this for safety.
# spring boot will read it form env variables

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
#This tells Hibernate to check whether the database schema matches your entities instead of automatically creating or updating tables.
spring.jpa.show-sql=false
#This avoids printing SQL statements to the console unnecessarily.

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

logging.level.root=INFO
logging.level.com.example.first=INFO
logging.file.name=logs/student-management.log

server.port=${PORT:8080}